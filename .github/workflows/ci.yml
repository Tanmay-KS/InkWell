name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The cheapest possible CI: lint and test, no secrets, no network calls.
# A CI job that needs credentials is a CI job that stops working the day
# the credentials expire, and this project's credentials are worth
# keeping out of a CI log.
#
# The tests generate their own small corpus rather than depending on the
# full one, so they run without the corpus being present.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ocr]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: The corpus generator must still run
        run: |
          python eval/gen_synthetic_docs.py --out /tmp/corpus --count 3 \
            --seed 20261019 --today 2026-10-20 --render
          python eval/qa_corpus.py --docs /tmp/corpus --count 3 \
            --seed 20261019 --today 2026-10-20
