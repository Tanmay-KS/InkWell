<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ledger</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --line: #262b36;
        --text: #e6e8ee;
        --muted: #949bab;
        --accent: #7aa2f7;
        --warn: #e0af68;
        --ok: #9ece6a;
        --bad: #f7768e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        padding: 22px 28px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: baseline;
        gap: 14px;
      }
      h1 { font-size: 19px; margin: 0; letter-spacing: 0.2px; }
      header span { color: var(--muted); font-size: 13px; }
      main { max-width: 940px; margin: 0 auto; padding: 28px; }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 18px 20px;
        margin-bottom: 18px;
      }
      .panel h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        color: var(--muted);
        margin: 0 0 14px;
        font-weight: 600;
      }
      ul { list-style: none; margin: 0; padding: 0; }
      li {
        display: flex;
        gap: 14px;
        align-items: baseline;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      li:first-child { border-top: 0; }
      .when { font-variant-numeric: tabular-nums; color: var(--accent); min-width: 108px; }
      .what { flex: 1; }
      .who { color: var(--muted); font-size: 13px; }
      .state {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
        white-space: nowrap;
      }
      .state.soon { color: var(--warn); border-color: var(--warn); }
      .state.due { color: var(--bad); border-color: var(--bad); }
      .state.done { color: var(--ok); border-color: var(--ok); }
      .empty { color: var(--muted); font-style: italic; }
      footer { color: var(--muted); font-size: 12px; padding: 0 28px 40px; max-width: 940px; margin: 0 auto; }
      code {
        background: #1e222b;
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 12.5px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Ledger</h1>
      <span>deadlines, renewals, and entitlements</span>
    </header>
    <main>
      <section class="panel">
        <h2>Coming up</h2>
        <ul id="due"><li class="empty">Nothing due.</li></ul>
      </section>

      <section class="panel">
        <h2>Household</h2>
        <ul id="items"><li class="empty">Nothing tracked yet.</li></ul>
      </section>
    </main>
    <footer>
      Phase 4 — this view is a placeholder until the pipeline lands.
      The data it renders comes from <code>agent/memory/hermes_memory.py</code>.
    </footer>
    <script src="app.js"></script>
  </body>
</html>
