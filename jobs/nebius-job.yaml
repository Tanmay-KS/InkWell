apiVersion: batch.nebius.ai/v1alpha1
kind: Job
metadata:
  name: ledger-deadline-monitor
  namespace: default
  labels:
    app.kubernetes.io/name: ledger
    app.kubernetes.io/component: deadline-monitor
    app.kubernetes.io/part-of: ledger
spec:
  # Daily trigger at 08:00 UTC
  schedule: "0 8 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
      containers:
        - name: deadline-monitor
          image: ghcr.io/tanmay-ks/ledger-deadline-monitor:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "jobs.deadline_monitor"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: LEDGER_LOOK_AHEAD_DAYS
              value: "14"
            - name: LEDGER_MEMORY_DB
              value: "/data/ledger_memory.db"
            - name: LEDGER_STATE_PATH
              value: "/data/state/job_state.json"
            - name: LEDGER_NOTIFY
              value: "1"
            # Optional Telegram delivery configuration
            # - name: TELEGRAM_BOT_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: ledger-secrets
            #       key: telegram-bot-token
            # - name: TELEGRAM_CHAT_ID
            #   valueFrom:
            #     secretKeyRef:
            #       name: ledger-secrets
            #       key: telegram-chat-id
            # Optional Slack / Generic webhook configuration
            # - name: LEDGER_WEBHOOK_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: ledger-secrets
            #       key: webhook-url
          volumeMounts:
            - name: ledger-storage
              mountPath: /data
      volumes:
        - name: ledger-storage
          persistentVolumeClaim:
            claimName: ledger-shared-storage
